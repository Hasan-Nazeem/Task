name: mern-production

services:
  mongo:
    image: mongo:7
    command: ["mongod", "--quiet", "--logpath", "/dev/null"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [app-network]

  user-service:
    image: ${ECR_REGISTRY}/${USER_REPOSITORY:-user-service}:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      SERVICE_NAME: user
      PORT: 3000
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/mern_ecommerce}
      BASE_API_URL: api
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks: [app-network]

  product-service:
    image: ${ECR_REGISTRY}/${PRODUCT_REPOSITORY:-product-service}:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      SERVICE_NAME: product
      PORT: 3000
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/mern_ecommerce}
      BASE_API_URL: api
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks: [app-network]

  order-service:
    image: ${ECR_REGISTRY}/${ORDER_REPOSITORY:-order-service}:${IMAGE_TAG:-latest}
    env_file: .env
    environment:
      SERVICE_NAME: order
      PORT: 3000
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/mern_ecommerce}
      BASE_API_URL: api
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped
    networks: [app-network]

  client:
    image: ${ECR_REGISTRY}/${FRONTEND_REPOSITORY:-frontend}:${IMAGE_TAG:-latest}
    depends_on:
      - user-service
      - product-service
      - order-service
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [app-network]

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      client:
        condition: service_healthy
      user-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    restart: unless-stopped
    networks: [app-network]

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command: ["--path.rootfs=/host"]
    volumes:
      - "/:/host:ro,rslave"
    pid: host
    restart: unless-stopped
    networks: [monitoring]

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    depends_on:
      - node-exporter
    restart: unless-stopped
    networks: [app-network, monitoring]

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks: [monitoring]

volumes:
  mongo-data:
  prometheus-data:
  grafana-data:

networks:
  app-network:
    driver: bridge
  monitoring:
    driver: bridge
