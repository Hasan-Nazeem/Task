events {}

http {
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream frontend {
        server client:8080;
    }
    upstream user_service {
        server user-service:3000;
    }
    upstream product_service {
        server product-service:3000;
    }
    upstream order_service {
        server order-service:3000;
    }

    server {
        listen 80;
        server_name _;

        # User Service routes
        location ~ ^/api/(auth|user|address|newsletter|contact|merchant)(/|$) {
            proxy_pass http://user_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Product Service routes
        location ~ ^/api/(product|category|brand|review|wishlist)(/|$) {
            proxy_pass http://product_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Order Service routes
        location ~ ^/api/(cart|order)(/|$) {
            proxy_pass http://order_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Socket.IO support chat is hosted by the User Service.
        location /socket.io/ {
            proxy_pass http://user_service;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
        }

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
